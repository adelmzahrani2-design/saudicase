<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مَنارة — معاينة المنصة</title>
  <style>
    body {font-family: system-ui, sans-serif; margin:0; background:#0b1220; color:#e8edf8}
    header{padding:16px 20px; border-bottom:1px solid #24304a; display:flex; justify-content:space-between; align-items:center}
    .badge{background:#ef4444;color:#fff;padding:4px 10px;border-radius:999px;font-size:12px}
    .container{max-width:1100px; margin:0 auto; padding:18px}
    .ticker{background:#111a2e;border:1px solid #24304a;border-radius:12px;padding:10px;margin-bottom:14px}
    .grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}
    .card{background:#111a2e;border:1px solid #24304a;border-radius:12px;padding:14px}
    button{background:#4f46e5;border:none;color:#fff;padding:10px 12px;border-radius:10px;cursor:pointer}
    input,select,textarea{width:100%;margin:6px 0 10px;background:#0b1220;color:#e8edf8;border:1px solid #2e3d5f;border-radius:8px;padding:9px}
    .spark{border-bottom:1px dashed #2e3d5f;padding:8px 0}
    @media (max-width: 768px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header>
  <strong>مَنارة — منصة الشرارات الذكية</strong>
  <span class="badge">LIVE DEMO</span>
</header>
<div class="container">
  <div class="ticker" id="ticker">📰 جاري تحميل الأخبار...</div>
  <div class="grid">
    <section class="card">
      <h3>توليد شرارة</h3>
      <label>المصدر</label>
      <input id="source" value="YouTube" />
      <label>المستوى</label>
      <select id="level"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
      <label>المحتوى</label>
      <textarea id="content" rows="5">ملخص فيديو عن أساسيات الذكاء الاصطناعي</textarea>
      <button id="gen">أشعل الشرارة</button>
      <pre id="out"></pre>
    </section>
    <aside class="card">
      <h3>آخر الشرارات</h3>
      <div id="sparks"></div>
    </aside>
  </div>
</div>
<script>
const news=[
  'إطلاق نموذج عربي جديد لدعم التعليم الذكي',
  'شركة ناشئة تجمع تمويلًا لتطوير وكلاء AI',
  'تحديثات على أدوات صناع المحتوى بالذكاء الاصطناعي'
];
let idx=0;setInterval(()=>{idx=(idx+1)%news.length;document.getElementById('ticker').textContent='📰 '+news[idx]},2500);
document.getElementById('ticker').textContent='📰 '+news[0];
const sparks=[];
document.getElementById('gen').onclick=async()=>{
  const content=document.getElementById('content').value;
  const sourceName=document.getElementById('source').value;
  const level=document.getElementById('level').value;
  try{
    const res=await fetch('/api/spark',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content,sourceName,level})});
    const data=await res.json();
    document.getElementById('out').textContent=JSON.stringify(data,null,2);
    sparks.unshift(`المستوى ${level} — ${sourceName}`);
    document.getElementById('sparks').innerHTML=sparks.slice(0,6).map(s=>`<div class='spark'>✨ ${s}</div>`).join('');
  }catch(e){document.getElementById('out').textContent='تعذر الاتصال بـ /api/spark. شغّلها عبر Next/Vercel أو جرّب لاحقاً.'}
}
</script>
</body>
</html>
